#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - lsb-release

write_files:
  - path: /opt/ai-bootstrap/run.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      APP_DIR="${app_dir}"

      # Install Docker
      if ! command -v docker >/dev/null 2>&1; then
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg

        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null

        apt-get update
        apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      fi

      # Add user to docker group (safe even if already)
      id -u ${var_admin_user} >/dev/null 2>&1 && usermod -aG docker ${var_admin_user} || true

      # Clone repo
      mkdir -p "$APP_DIR"
      if [ ! -d "$APP_DIR/.git" ]; then
        git clone --branch ${branch} --depth 1 ${repo_url} "$APP_DIR"
      else
        cd "$APP_DIR" && git fetch --all && git reset --hard "origin/${branch}"
      fi

      # Run compose
      cd "$APP_DIR/compose"
      docker compose pull || true
      docker compose up -d

runcmd:
  - bash -lc 'export repo_url="${repo_url}" branch="${branch}" app_dir="${app_dir}" var_admin_user="mahbub"; /opt/ai-bootstrap/run.sh'
